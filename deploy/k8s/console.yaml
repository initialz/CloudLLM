apiVersion: apps/v1
kind: Deployment
metadata:
  name: byok-console
  namespace: byok
  labels:
    app.kubernetes.io/name: byok-console
    app.kubernetes.io/part-of: byok
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: byok-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: byok-console
        app.kubernetes.io/part-of: byok
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: console
          # 替换 <registry> 和 <tag> 为实际镜像地址
          image: <registry>/byok-console:<tag>
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: byok-secrets
                  key: DATABASE_URL
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: byok-secrets
                  key: MASTER_KEY
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: byok-secrets
                  key: SESSION_SECRET
            # Console 在生成接入说明时嵌入此地址，供成员使用
            # 生产环境替换为实际的网关对外地址（Ingress 域名或 LB IP）
            - name: GATEWAY_PUBLIC_URL
              value: "https://api.<your-domain>"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: byok-console
  namespace: byok
  labels:
    app.kubernetes.io/name: byok-console
    app.kubernetes.io/part-of: byok
spec:
  selector:
    app.kubernetes.io/name: byok-console
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
