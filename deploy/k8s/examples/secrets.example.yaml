# ┌─────────────────────────────────────────────────────────────────────────┐
# │  BYOK K8s Secret 模板                                                   │
# │                                                                         │
# │  警告：此文件仅为模板，不含任何真实凭证，不得直接 apply！               │
# │  使用步骤：                                                             │
# │    1. 生成真实值（见下方生成命令）                                      │
# │    2. 使用 kubectl create secret 或 SealedSecrets/SOPS 创建 Secret      │
# │    3. 不要将含真实值的文件提交到版本库                                  │
# │                                                                         │
# │  推荐的 Secret 管理方案：                                               │
# │    A. SealedSecrets：https://github.com/bitnami-labs/sealed-secrets     │
# │       加密后的 SealedSecret 资源可安全提交到 Git                        │
# │    B. SOPS + age/KMS：https://github.com/mozilla/sops                  │
# │       使用非对称加密或云 KMS 加密 secret 文件                          │
# │    C. 外部 Secret 管理（External Secrets Operator）：                   │
# │       从 Vault/AWS Secrets Manager/Azure Key Vault 等拉取              │
# │       https://external-secrets.io/                                      │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ── 使用 kubectl 直接创建（不推荐，值明文存在于 shell history）──────────────
# kubectl create secret generic byok-secrets \
#   --namespace=byok \
#   --from-literal=DATABASE_URL='postgres://byok:<password>@<pg-host>:5432/byok' \
#   --from-literal=REDIS_URL='redis://:<password>@<redis-host>:6379' \
#   --from-literal=MASTER_KEY="$(openssl rand -base64 32)" \
#   --from-literal=SESSION_SECRET="$(openssl rand -hex 32)"
#
# ── 生成各字段的命令 ─────────────────────────────────────────────────────
# DATABASE_URL: postgres://<user>:<password>@<托管PG主机>:5432/<db>
#   注：PG 不部署在集群内，连接托管实例（见 README.md §外部依赖）
#
# REDIS_URL: redis://:<password>@<托管Redis主机>:6379
#   注：Redis 不部署在集群内，连接托管实例
#
# MASTER_KEY（32 字节 base64 编码）：
#   openssl rand -base64 32
#   重要：此密钥丢失将导致所有渠道凭证无法解密！请务必备份。
#
# SESSION_SECRET（≥32 字符随机字符串）：
#   openssl rand -hex 32
#
apiVersion: v1
kind: Secret
metadata:
  name: byok-secrets
  namespace: byok
  labels:
    app.kubernetes.io/part-of: byok
type: Opaque
stringData:
  # PG 连接串（指向公司托管数据库，不是集群内 Pod）
  DATABASE_URL: "postgres://byok:CHANGE_ME_PASSWORD@CHANGE_ME_PG_HOST:5432/byok"
  # Redis 连接串（指向公司托管 Redis，不是集群内 Pod）
  REDIS_URL: "redis://:CHANGE_ME_PASSWORD@CHANGE_ME_REDIS_HOST:6379"
  # 渠道凭证信封加密主密钥（openssl rand -base64 32）
  MASTER_KEY: "CHANGE_ME_32BYTES_BASE64_ENCODED_KEY="
  # Console 会话签名密钥（openssl rand -hex 32）
  SESSION_SECRET: "CHANGE_ME_SESSION_SECRET_AT_LEAST_32_CHARS"
