apiVersion: apps/v1
kind: Deployment
metadata:
  name: byok-gateway
  namespace: byok
  labels:
    app.kubernetes.io/name: byok-gateway
    app.kubernetes.io/part-of: byok
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: byok-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: byok-gateway
        app.kubernetes.io/part-of: byok
    spec:
      # 优雅停机：SIGTERM → 25s 排水（terminationGracePeriodSeconds 给 30s 余量）
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          # 替换 <registry> 和 <tag> 为实际镜像地址；tag 推荐使用 git commit SHA
          # 示例：registry.company.com/byok/byok-gateway:v1.2.0-abc1234
          image: <registry>/byok-gateway:<tag>
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: byok-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: byok-secrets
                  key: REDIS_URL
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: byok-secrets
                  key: MASTER_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # preStop sleep 5s 保证 Ingress/LB 摘流后再开始排水；
              # 应用自身 SIGTERM handler 有 25s 排水窗口，总宽限 30s
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: byok-gateway
  namespace: byok
  labels:
    app.kubernetes.io/name: byok-gateway
    app.kubernetes.io/part-of: byok
spec:
  selector:
    app.kubernetes.io/name: byok-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
