apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: byok-ingress
  namespace: byok
  labels:
    app.kubernetes.io/name: byok-ingress
    app.kubernetes.io/part-of: byok
  annotations:
    # ── Ingress Controller 注解（按公司环境修改）────────────────────────────────
    # nginx-ingress 示例（取消注释并按需调整）：
    # kubernetes.io/ingress.class: "nginx"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "300"    # 流式响应需要较长超时
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"       # 流式响应关闭缓冲
    #
    # AWS ALB 示例：
    # kubernetes.io/ingress.class: "alb"
    # alb.ingress.kubernetes.io/scheme: "internal"
    #
    # TLS/cert-manager 示例（取消注释）：
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # ──────────────────────────────────────────────────────────────────────────
spec:
  # ── IngressClass（按公司环境修改或删除，使用默认 IngressClass）──────────────
  # ingressClassName: nginx
  rules:
    # ── Gateway：API 端点，供调用方使用 ─────────────────────────────────────
    # 替换 <domain> 为实际域名，例如 api.llm.company.com
    - host: api.<domain>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: byok-gateway
                port:
                  number: 80
    # ── Console：管理后台 ───────────────────────────────────────────────────
    # 替换 <domain> 为实际域名，例如 console.llm.company.com
    - host: console.<domain>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: byok-console
                port:
                  number: 80
  # ── TLS（按公司 TLS 策略配置，取消注释）──────────────────────────────────
  # tls:
  #   - hosts:
  #       - api.<domain>
  #     secretName: byok-gateway-tls
  #   - hosts:
  #       - console.<domain>
  #     secretName: byok-console-tls
