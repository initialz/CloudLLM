# 升级时先删除旧 Job 再重新 apply，或使用 kubectl create 而非 apply
# kubectl delete job cloudllm-migrate -n cloudllm --ignore-not-found
# kubectl apply -f migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudllm-migrate
  namespace: cloudllm
  labels:
    app.kubernetes.io/name: cloudllm-migrate
    app.kubernetes.io/part-of: cloudllm
spec:
  # 完成后 600 秒自动清理（保留日志供查看），设为 0 立即清理
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudllm-migrate
        app.kubernetes.io/part-of: cloudllm
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # 使用 worker 镜像执行迁移脚本（@cloudllm/db 编译产物）
          # 替换 <registry> 和 <tag> 为实际镜像地址
          image: <registry>/cloudllm-worker:<tag>
          command: ["node", "node_modules/@cloudllm/db/dist/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudllm-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
