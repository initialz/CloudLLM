# =============================================================================
# !!!  仅开发环境 — DEVELOPMENT ONLY  !!!
# 生产部署请使用 deploy/docker-compose.prod.yml 并通过 .env 注入所有密钥
#
# 本文件内嵌固定 dev 密钥（已公开，无安全价值），开箱即用无需任何配置：
#   MASTER_KEY     — 信封加密主密钥（32 字节 base64），生成命令：openssl rand -base64 32
#   SESSION_SECRET — Console 会话签名密钥（hex），生成命令：openssl rand -hex 32
#
# 端口说明（避免与本地已运行的开发服务冲突）：
#   postgres: 15432:5432  ← 本机 5432 已被现有 dev PG 容器占用，映射 15432 避免冲突
#                           容器内互联仍使用 5432，应用连接串无需改动
#   redis:     6380:6379  ← 本机 6379 已被占用，映射 6380；容器内互联仍 6379
#   gateway:   8080:8080
#   console:   3000:3000
#
# 卷说明：
#   cloudllm-dev_pgdata — 独立的 dev compose 专属卷（不与根 docker-compose.yml 的 pgdata 共享）
#                     两个 PostgreSQL 实例不可写同一数据目录，独立卷保证数据安全
#                     如需复用现有数据，请手动迁移或使用 pg_dump/restore
#
# 快速启动：
#   docker compose -f docker-compose.dev.yml up -d --build
# =============================================================================

name: cloudllm-dev

services:
  # ---------------------------------------------------------------------------
  # 基础设施
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudllm
      POSTGRES_PASSWORD: cloudllm_dev
      POSTGRES_DB: cloudllm
    ports:
      # 注意：本机 5432 已被现有 dev PG 容器占用，此处映射 15432:5432
      # 宿主访问：psql -h localhost -p 15432 -U cloudllm cloudllm
      # 容器内互联：DATABASE_URL=postgres://cloudllm:cloudllm_dev@postgres:5432/cloudllm（不变）
      - "15432:5432"
    volumes:
      - cloudllm-dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudllm -d cloudllm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # 注意：本机 6379 已被占用，映射 6380；容器内互联仍使用 redis:6379
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 一次性任务（migrate → seed）
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["node", "node_modules/@cloudllm/db/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://cloudllm:cloudllm_dev@postgres:5432/cloudllm
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["node", "node_modules/@cloudllm/db/dist/seed.js"]
    environment:
      DATABASE_URL: postgres://cloudllm:cloudllm_dev@postgres:5432/cloudllm
      # 默认 seed 管理员账号（可通过环境变量覆盖）
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: change-me-now
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # ---------------------------------------------------------------------------
  # 常驻应用服务
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://cloudllm:cloudllm_dev@postgres:5432/cloudllm
      REDIS_URL: redis://redis:6379
      # 固定 dev 主密钥（32 字节 base64）— 仅开发，勿用于生产
      MASTER_KEY: /o4Hoi3CCed8CohTkzih2Ni634Os4g16ZHPNU8SXsx8=
    extra_hosts:
      # Linux 上 host.docker.internal 需要显式映射（macOS 自动可用）
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cloudllm:cloudllm_dev@postgres:5432/cloudllm
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://cloudllm:cloudllm_dev@postgres:5432/cloudllm
      # 固定 dev 会话密钥（hex）— 仅开发，勿用于生产
      SESSION_SECRET: 8eaacf2d4f8f9d3019e9a3bab0ad343baba77f6a6af9cc2ce20990de0eb8cca5
      MASTER_KEY: /o4Hoi3CCed8CohTkzih2Ni634Os4g16ZHPNU8SXsx8=
      GATEWAY_PUBLIC_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  # 独立卷，不与根 docker-compose.yml 的 pgdata 共享
  # 确保两个 PG 实例不会写同一数据目录（数据安全优先）
  cloudllm-dev_pgdata:
