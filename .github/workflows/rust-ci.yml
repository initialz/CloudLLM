name: rust-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  admin-ui:
    runs-on: ubuntu-latest
    # admin-ui 在后续任务才创建;目录不存在时跳过,避免 P1 中途 CI 红
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: |
          if [ -f admin-ui/package.json ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.exists.outputs.yes == 'true'
        working-directory: admin-ui
        run: npm ci && npm run build
      - if: steps.exists.outputs.yes == 'false'
        run: echo "::warning::admin-ui 尚未创建,跳过构建(admin-ui 落地后此分支应改为 exit 1)"
